<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildlight Survivors</title>
  </head>
  <body>
    <canvas id="game" aria-label="Wildlight Survivors WebGL game canvas"></canvas>
    <div id="hud" aria-live="polite">
      <div class="brand">Wildlight Survivors</div>
      <div class="stats">
        <span id="health">Health 100</span>
        <span id="food">Food 100</span>
        <span id="wood">Wood 0</span>
        <span id="score">Score 0</span>
      </div>
      <div class="help">Move WASD/Arrows · Aim mouse · Click to strike · Gather trees and berries · Survive the night</div>
    </div>
    <div id="game-over" hidden>
      <h1>You survived <span id="final-time">0</span>s</h1>
      <p>Press R to return to the wild.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
